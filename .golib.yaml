schema_version: 1
tool_version: v1.0.4
tool_checksums_sha256: 6c1ee70e3fa7aa333d12420dc78d7740f4de78717d1979eeb8a5f70a2a124ba0
manifest:
  modules: modules.json
  packages: packages.json
evidence:
  root: ".verification"
mutation:
  root: ".verification/mutation"
  imports:
  - module: "."
    archive: ".verification/mutation/bootstrap/root.zip"
    ledger: ".verification/mutation/migration-ledger.json"
api:
  baselines:
  - module: "."
    mode: apidiff
    path: api/baseline.txt
operations:
- module: "."
  gate: docs
  steps:
  - type: make
    makefile: verification/package.mk
    target: docs
    timeout: 20m
- module: "."
  gate: test
  steps:
  - type: go-test
    packages: ["."]
    run: '^Test(CanceledHalfOpenWaitReleasesClockTimer|CloseDrainsObserverQueueAndDropsLaterEvents|AsynchronousObserverCanRequestCloseReentrantly|ShutdownHonorsContextWhileObserverIsBlocked)$'
    count: 10
    timeout: 20m
  - type: go-test
    packages: ["./breakertest"]
    run: '^TestStoppedTimersAreNotRetained$'
    count: 10
    timeout: 20m
- module: "."
  gate: fuzz
  steps:
  - type: go-test
    packages: ["."]
    fuzz: '^FuzzConfigurationNeverPanics$'
    budget: 100x
    timeout: 2m
  - type: go-test
    packages: ["."]
    fuzz: '^FuzzPermitOperationSequences$'
    budget: 100x
    timeout: 2m
  - type: go-test
    packages: ["."]
    fuzz: '^FuzzObserverSequences$'
    budget: 100x
    timeout: 2m
  - type: go-test
    packages: ["."]
    fuzz: '^FuzzConfigurationResourceBounds$'
    budget: 100x
    timeout: 2m
  - type: go-test
    packages: ["."]
    fuzz: '^FuzzExecutionDurationsAndOutcomes$'
    budget: 100x
    timeout: 2m
  - type: go-test
    packages: ["./window"]
    fuzz: '^FuzzCountMatchesBoundedReference$'
    budget: 100x
    timeout: 2m
  - type: go-test
    packages: ["./window"]
    fuzz: '^FuzzTimeWindowTimestamps$'
    budget: 100x
    timeout: 2m
- module: "."
  gate: benchmark
  steps:
  - type: go-test
    packages: ["./..."]
    benchmark: "."
    budget: 100ms
    timeout: 20m
